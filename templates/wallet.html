{% extends "base.html" %}
{% block title %}Wallet · Smart Parking{% endblock %}
{% block content %}
<div class="centered-form-page">
<div class="card" style="max-width:420px;">
  <h1>Wallet</h1>
  <p>Current balance: <strong>₹ {{ "%.2f"|format(user.wallet_balance|float) }}</strong></p>
  {% if error %}
  <div class="alert alert-error" role="alert">{{ error }}</div>
  {% endif %}
  <form method="post" action="{{ url_for('wallet_topup') }}" class="form-grid">
    <label>Top-up amount (₹)
      <input type="number" name="amount" required min="0.01" step="0.01" placeholder="500">
    </label>
    <button type="submit" class="btn btn-primary">Add funds</button>
  </form>
</div>
</div>
{% endblock %}
