{% extends "base.html" %}
{% block title %}Register · Smart Parking{% endblock %}
{% block content %}
<div class="centered-form-page">
<div class="card" style="max-width:440px;">
  <h1>Create account</h1>
  {% if error %}
  <div class="alert alert-error" role="alert">{{ error }}</div>
  {% endif %}
  <form method="post" action="{{ url_for('register_submit') }}" class="form-grid">
    <label>Full name
      <input type="text" name="full_name" required maxlength="255" autocomplete="name">
    </label>
    <label>Email
      <input type="email" name="email" required autocomplete="email">
    </label>
    <label>Password (min 8 characters)
      <input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
    </label>
    <div class="actions-row">
      <button type="submit" class="btn btn-primary">Register</button>
      <a class="btn btn-secondary" href="{{ url_for('login_page') }}">Back to log in</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
